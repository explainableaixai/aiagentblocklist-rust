[package]
name = "aiagentblocklist"
version = "1.0.0"
edition = "2021"
authors = ["Alpha Quantum <info@alpha-quantum.com>"]
description = "Feed client for the AI agent blocklist: download the daily files with ETag caching and match domains, extensions, processes and packages locally."
license = "MIT"
readme = "README.md"
homepage = "https://www.aiagentblocklist.com"
repository = "https://github.com/explainableaixai/aiagentblocklist-rust"
documentation = "https://docs.rs/aiagentblocklist"
keywords = ["ai-agents", "blocklist", "mcp", "dns-filtering", "shadow-ai"]
categories = ["api-bindings", "command-line-utilities", "network-programming"]
exclude = [".github/*", "_old/*"]

[dependencies]
ureq = "2.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[example]]
name = "aab"
path = "examples/aab.rs"

[[example]]
name = "scan_log"
path = "examples/scan_log.rs"
